{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator MVP - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static "assets/css/accounts.css" %}">
</head>
<body>

    <section class="accounts_section">
        <div class="accounts_card_body_div">
            <div class="accounts_title">
                <h1>Welcome to MVP</h1>
            </div>
            <form class="acounts_form_main" method="POST">
                {% csrf_token %}
                 {% if messages %}
    <div class="alert-container">
        {% for message in messages %}
            <div class="alert alert-primary">{{ message }}</div>
        {% endfor %}
    </div>
{% endif %}
                <div class="row">
                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <div class="accounts_input">
                            <label for="">First Name</label>
                            <input type="text" placeholder="Breeje" name="first_name">
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <div class="accounts_input">
                            <label for="">Last Name</label>
                            <input type="text" placeholder="Anadkat" name="last_name">
                        </div>
                    </div>
                    <div class="col-lg-12 col-md-12 col-sm-12">
                        <div class="accounts_input">
                            <label for="">Email</label>
                            <input type="email" placeholder="breeje7@gmail.com" name="email">
                        </div>
                    </div>
                    <div class="col-lg-12 col-md-12 col-sm-12">
                        <div class="accounts_input">
                            <label for="">Password</label>
                            <input type="password" placeholder="Create Password" id="password1" name="password"> 
                            <i class="bi bi-eye-slash toggle-password" toggle="#password1"></i>
                        </div>
                    </div>
                </div>
                <div class="forgot_txt">
                    <a href="{% url "password_reset" %}">Forgot Password?</a>
                </div>
                <div class="accounts_btn">
                    <button type="submit">Login</button>
                </div>
                
                <p class="last_ptxt">Don’t  have an account? <a href="{% url "sign" %}">Signup</a></p>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="{% static "assets/js/script.js" %}"></script>
</body>
</html>
