<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    .chatbot_main_div{
        background: linear-gradient(0deg, rgba(20, 20, 20, 0.85), rgba(20, 20, 20, 0.85)),
        radial-gradient(28.47% 31.35% at 60.29% 47.49%, rgba(11, 202, 202, 0.0132) 0%, rgba(26, 26, 26, 0.066) 100%),
        radial-gradient(50% 50% at 50% 50%, rgba(27, 27, 27, 0) 0%, #0D0D0D 66.24%);
        color: white;
        display: flex;
        gap: 20px ;
        height: 100vh;
        overflow: hidden;
        padding: 20px;
    }
    .sidebar {
      width: 250px;
      background: #121212;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border-right: 1px solid #1F2738;
      animation: slideInLeft 0.6s ease;
      box-shadow: 0px 17px 40px 4px #7090B01C;
      border-radius: 20px;
      overflow-y: auto;
    }
    .sidebar::-webkit-scrollbar{
      height: 0;
      width: 0;
    }

    .sidebar h2 {
      margin-bottom: 20px;
      color: #ffffff;
      font-size: 1.3rem;
    }

    .nav_section {
      flex: 1;
    }

    .nav_section h4 {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #FFFFFF;
    }

    .nav_section_inner .nav-item {
      margin: 10px 0;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      color: #6b7280;
    }

    .nav_section_inner .nav-item:hover {
      background: #2D3748;
      color: #ffffff;
    }

    .profile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 10px;
      background: #FFFFFF;
      border-radius: 30px;
      box-shadow: 14px 17px 40px 4px #7090B014;
      position: sticky;
      bottom: 0;
      right: 0;
      left: 0;
    }
    .profile_inner{
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .profile img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    .profile span{
      color: #000000;
      font-size: 14px;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: transparent;
      animation: fadeIn 0.7s ease;
      position: relative;
      transition: all 0.4s ease;
    }

    .main.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999;
      padding: 30px;
      border-radius: 0;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .model-switch{
      position: absolute;
      top: 0;
      width: -webkit-fill-available;
      display: flex;
      justify-content: center;
    }
    .model-switch button {
      background: transparent;
      opacity: 0.4;
      border: none;
      color: white;
      padding: 8px 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .star_circ{
      background: linear-gradient(180deg, #FBFBFF 0%, #CACAFF 100%);
      height: 30px;
      width: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
    }
    .star_circ img{
      object-fit: contain;
      height: 20px;
      width: 20px;
    }
    .model-switch button.active {
      background: #FFFFFF;
      color: black;
      font-weight: bold;
      opacity: 4;
      color: #000000E0;
    }
    .chat-window {
      position: relative;
      flex: 1;
      border-radius: 15px;
      padding: 20px;
      overflow-y: auto;
      margin-bottom: 20px;
      background: transparent;
    }

    .inputbox_main {
      display: flex;
      align-items: center;
    }

    .inputbox_main input {
      background: transparent;
      border: 1px solid #E2E8F0;
      color: white;
      outline: none;
      background: #1F2738;
      padding: 12px 20px;
      border-radius: 30px;
      flex: 1;
      background: linear-gradient(0deg, rgba(20, 20, 20, 0.85), rgba(20, 20, 20, 0.85)), radial-gradient(28.47% 31.35% at 60.29% 47.49%, rgba(11, 202, 202, 0.0132) 0%, rgba(26, 26, 26, 0.066) 100%),radial-gradient(50% 50% at 50% 50%, rgba(27, 27, 27, 0) 0%, #0D0D0D 66.24%);

    }

    .inputbox_main button {
      background: linear-gradient(15.46deg, #288C93 26.3%, #31A8B0 86.4%);
      box-shadow: 0px 21px 27px -10px #288C937A;
      color: #FFFFFF;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      margin-left: 10px;
      cursor: pointer;
      font-weight: 600;
      min-width: 150px;
    }

    .fullscreen-toggle {
        width: 50px;
        height: 50px;
        /* background: linear-gradient(145deg, #00B5C5, #00E0FF); */
        background: linear-gradient(15.46deg, #288C93 26.3%, #31A8B0 86.4%);
        border-radius: 50%; 
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 209, 255, 0.4);
        transition: transform 0.3s ease;
    }

    .fullscreen-toggle:hover {
      transform: scale(1.05);
    }

    .fullscreen-toggle i {
      color: #FFFFFF;
      font-size: 16px;
    }

    @keyframes slideInLeft {
      0% { transform: translateX(-100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }
    .nav_section_inner{
        padding: 20px 0px;
        border-bottom: 1px solid #90929696;
    }
    .inputbox_inner{
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .chat_header_last_icons{
      display: flex;
      justify-content: end;
      align-items: center;
      gap: 20px;
    }
    .chat_header_last_icons i{
      color: #848484;
    }
    .chat_header_last_icons i{
      font-size: 22px;
    }
    .chat_header_last_icons img{
      height: 50px;
      width: 50px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }
    .sidebar_inner{
      position: relative;
    }
  </style>
</head>
<body>

    <section class="chatbot_section">
        <div class="container-fluid">
            <div class="chatbot_main_div">
                  <div class="sidebar">
                    <div class="sidebar_inner">
                      <div>
                      <h2><img src="./assets/img/stars.png" alt=""> Chat UI</h2>
                      <div class="nav_section">
                          <div class="nav_section_inner">
                              <div class="nav-item"><img src="assets/img/lib.png" alt=""> Libraries</div>
                              <div class="nav-item"><img src="assets/img/lib2.png" alt="">  Explore Chatgpt</div>
                          </div>
                          <div class="nav_section_inner">
                            <h4>Today</h4>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                          </div>
                          <div class="nav_section_inner">
                            <h4>Yesterday</h4>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                            <div class="nav-item">Operation MVP</div>
                          </div>
                      </div>
                      </div>
                      <div class="profile">
                        <div class="profile_inner">
                          <img src="https://i.pravatar.cc/40" alt="avatar">
                          <span>Adela Parkson</span>
                        </div>
                       <img src="assets/img/Logout.png" alt="">
                      </div>
                    </div>
                </div>

                <div class="main" id="main">
                    <div class="chat-header">
                    <h2>Chat UI</h2>
                    <div class="chat_header_last_icons">
                      <i class="bi bi-search"></i>
                      <i class="bi bi-bell"></i>
                      <i class="bi bi-moon-fill"></i>
                      <i class="bi bi-info-circle"></i> 
                      <img src="https://i.pravatar.cc/40" alt="avatar">
                    </div>
                    </div>
                    <div class="chat-window" id="chat-window">
                    <!-- Messages appear here -->
                     <div class="model-switch">
                        <button class="active" onclick="switchModel(this)"><div class="star_circ"><img src="assets/img/stars.png" alt="..."></div>GPT-3.5</button>
                        <button onclick="switchModel(this)"><div class="star_circ"><img src="assets/img/stars.png" alt="..."></div>GPT-4</button>
                    </div>
                    </div>
                    <div class="inputbox_main">
                      <input type="text" id="user-input" placeholder="Send a message...">
                      <div class="inputbox_inner">
                        <button onclick="sendMessage()">Submit</button>
                        
                        <div class="fullscreen-toggle" onclick="toggleFullscreen()">
                         <i class="bi bi-fullscreen"></i>
                        </div>
                      </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="./assets/js/script.js"></script>
  <script>
    function switchModel(btn) {
      document.querySelectorAll('.model-switch button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const chatWindow = document.getElementById('chat-window');
      if (input.value.trim()) {
        const msg = document.createElement('div');
        msg.textContent = input.value;
        msg.style.padding = '10px';
        msg.style.margin = '10px 0';
        msg.style.background = '#2D3748';
        msg.style.borderRadius = '10px';
        chatWindow.appendChild(msg);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        input.value = '';
      }
    }

    function toggleFullscreen() {
      const main = document.getElementById('main');
      main.classList.toggle('fullscreen');
    }
  </script>
</body>
</html>
